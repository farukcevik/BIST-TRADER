name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Static checks
        run: python tools/static_check.py
      - name: Secret scan
        run: python tools/secret_scan.py
      - name: Compile
        run: python -m compileall -q bistbot tests tools dashboard.py main.py
      - name: Tests
        run: python -m pytest -q
