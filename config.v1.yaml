capital: 200000
database: bistbot.db
strategy_version: v1.0.0
schedule_seconds: 300
scanner_top_n: 40
analysis_top_n: 10
dashboard:
  live_price_refresh_seconds: 30
market_regime:
  enabled: true
  refresh_minutes: 45
  high_materiality_threshold: 70
  macro_llm_materiality_threshold: 70
  sector_adjustment: 2
  behaviors:
    RISK_ON: {score_adjustment: 2, position_multiplier: 1.0}
    NORMAL: {score_adjustment: 0, position_multiplier: 1.0}
    CAUTION: {score_adjustment: -4, buy_threshold_adjustment: 3, position_multiplier: 0.75}
    RISK_OFF: {score_adjustment: -10, buy_threshold_adjustment: 8, position_multiplier: 0.40}
    CRISIS: {block_new_entries: true, position_multiplier: 0}
scanner:
  weights: {technical: 0.30, momentum: 0.30, volume: 0.20, liquidity: 0.10, volatility: 0.10}
  minimum_bars: 22
  recent_high_lookback: 20
  relative_volume_lookback: 20
  max_data_age_minutes: 30
  minimum_average_volume: 100000
  minimum_average_turnover_try: 1000000
  target_volatility_pct: 1.5
  maximum_preferred_volatility_pct: 5.0
intelligence:
  kap_trust_score: 95
  news_trust_score: 65
  recency_half_life_hours: 24
  llm_materiality_threshold: 50
  kap_retention_days: 90
  kap_base_backoff_seconds: 30
  kap_max_backoff_seconds: 900
  scanner_weight: 0.40
  event_weight: 0.60
  event_score_weights: {recency: 0.25, source_trust: 0.25, symbol_relevance: 0.20, keywords: 0.15, materiality: 0.15}
risk:
  max_open_positions: 5
  max_position_pct: 0.15
  min_cash_pct: 0.15
  max_trade_risk_pct: 0.005
  max_daily_loss_pct: 0.02
  max_weekly_loss_pct: 0.05
  max_total_drawdown_pct: 0.10
  default_stop_loss_pct: 0.04
  default_take_profit_pct: 0.08
  default_trailing_stop_pct: 0.035
  max_holding_days: 20
  max_price_age_minutes: 5
execution: {commission_pct: 0.001, slippage_pct: 0.0005}
scoring:
  technical: 0.30
  momentum: 0.20
  volume: 0.15
  news_kap: 0.20
  llm: 0.15
  buy_threshold: 65
  sell_threshold: 35
fundamental:
  enabled: true
  minimum_confidence: 40
  unavailable_policy: TECHNICAL_ONLY_FALLBACK
  fallback_minimum_risk_reward_ratio: 2.0
  fallback_minimum_technical_score: 75
  fallback_minimum_potential_confidence: 65
  minimum_score: 50
  weights: {growth_score: 0.20, profitability_score: 0.18, cash_flow_quality_score: 0.20, balance_sheet_score: 0.20, valuation_score: 0.12, consistency_score: 0.10}
valuation: {enabled: true}
technical_levels: {enabled: true, swing_window: 3, zone_atr_fraction: 0.35, dedup_atr_fraction: 0.05, tick_size: 0.01}
potential: {enabled: true}
strategy:
  minimum_risk_reward_ratio: 1.5
  minimum_catalyst_score: 50
  require_catalyst_confirmation: true
