[project]
name = "bistbot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "PyYAML>=6.0", "certifi>=2025.0", "openai>=1.0", "python-dotenv>=1.0", "aiohttp>=3.10", "streamlit>=1.37,<2", "pandas>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.bistbot_ci]
python_paths = ["bistbot", "tests", "tools", "dashboard.py", "main.py"]
secret_scan_paths = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
